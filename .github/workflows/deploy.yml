# Deploys the static build to GitHub Pages on every push to main.
# The build runs with PAGES=true so astro.config.mjs switches site/base to the
# repository subpath; production deploys ignore this workflow entirely.
name: Deploy preview to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Only one preview deploy at a time; a newer commit cancels an older build.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Type and content-collection checks must pass before publishing.
      - run: npm run check

      - run: npm run build:pages

      # Fail the deploy if links, metadata, ids or the size budget are broken.
      - run: node scripts/verify-build.mjs /RecuperarSRL-WebOficial

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
